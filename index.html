<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Image Notepad - GitHub Image Uploader</title>

<style>
  :root {
    --bg: #0b0b14;
    --panel: #141425;
    --accent: #ff4fa3;
    --muted: #9aa0b3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1a33, var(--bg));
    font-family: Inter, system-ui, sans-serif;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 600px;
    background: rgba(20, 20, 37, 0.75);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  h2 {
    margin: 0 0 16px;
    font-weight: 600;
    text-align: center;
  }

  input, button { font-family: inherit; }

  input {
    background: #0f1020;
    border: 1px solid #262650;
    color: white;
    padding: 12px;
    border-radius: 10px;
    outline: none;
    width: 100%;
    margin-top: 12px;
  }

  input:focus { border-color: var(--accent); }

  button {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #ff7dc2);
    color: black;
    transition: background 0.3s ease;
  }

  button:disabled {
    background: #444466;
    color: #aaaabb;
    cursor: not-allowed;
  }

  .token-hint {
    background: #fff7cc;
    color: #5a4b00;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 8px;
  }

  .token-hint code {
    background: rgba(0,0,0,0.08);
    padding: 2px 6px;
    border-radius: 6px;
  }

  .status {
    font-size: 14px;
    margin-top: 14px;
    color: var(--muted);
    min-height: 20px;
    text-align: center;
  }

  #disconnectBtn {
    background: #1e1e3a;
    color: white;
  }

  #toggleTokenBtn {
    margin-top: 8px;
    background: #262650;
    color: white;
    width: auto;
    padding: 8px 12px;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>☁️ Cloud Image Notepad</h2>

    <!-- GitHub Token -->
    <input
      id="token"
      type="text"
      placeholder="GitHub Personal Access Token (repo + read:user)"
      autocomplete="off"
    />
    <button id="toggleTokenBtn" onclick="toggleToken()">Show/Hide Token</button>
    <div class="token-hint">
      📌 Token needs: <code>repo</code> and <code>read:user</code> scopes.
    </div>

    <!-- Username / Repo / Folder -->
    <input id="username" placeholder="GitHub Username" autocomplete="off" />
    <input id="repo" placeholder="Repository Name" autocomplete="off" />
    <input id="folder" placeholder="Folder (default: images)" autocomplete="off" value="images" />

    <!-- Buttons -->
    <button id="connectBtn" onclick="connectGitHub()">Connect to GitHub</button>
    <button id="disconnectBtn" onclick="disconnectGitHub()">Disconnect</button>

    <!-- File + commit -->
    <input id="fileInput" type="file" accept="image/*" disabled />
    <input id="commitMessage" placeholder="Commit message" disabled autocomplete="off" />
    <button id="uploadBtn" onclick="addImage()" disabled>Add / Overwrite Image</button>

    <!-- Status -->
    <div class="status" id="status"></div>
  </div>

<script>
let githubConnected = false;
let ghToken = "";

// Load token from sessionStorage if present
const savedToken = sessionStorage.getItem("gh_token");
if (savedToken) {
  ghToken = savedToken;
  githubConnected = true;
  document.getElementById("fileInput").disabled = false;
  document.getElementById("commitMessage").disabled = false;
  document.getElementById("uploadBtn").disabled = false;
  document.getElementById("connectBtn").disabled = true;
  document.getElementById("token").disabled = true;
  setStatus("✅ Token loaded from session. Ready to upload images.");
}

// Toggle token visibility
function toggleToken(){
  const tokenInput = document.getElementById("token");
  if(tokenInput.type === "password"){ tokenInput.type = "text"; }
  else { tokenInput.type = "password"; }
}

function setStatus(msg, isError=false){
  const statusEl = document.getElementById("status");
  statusEl.textContent = msg;
  statusEl.style.color = isError ? "#ff6666" : "var(--muted)";
}

function connectGitHub(){
  const token = document.getElementById("token").value.trim();
  const username = document.getElementById("username").value.trim();
  const repo = document.getElementById("repo").value.trim();
  
  if(!token){ setStatus("❌ Enter your GitHub token", true); return; }
  if(!username){ setStatus("❌ Enter username", true); return; }
  if(!repo){ setStatus("❌ Enter repo name", true); return; }

  ghToken = token;
  githubConnected = true;
  sessionStorage.setItem("gh_token", token);

  document.getElementById("fileInput").disabled = false;
  document.getElementById("commitMessage").disabled = false;
  document.getElementById("uploadBtn").disabled = false;
  document.getElementById("connectBtn").disabled = true;
  document.getElementById("token").disabled = true;
  document.getElementById("username").disabled = true;
  document.getElementById("repo").disabled = true;
  document.getElementById("folder").disabled = true;

  setStatus("✅ Connected to GitHub. Ready to upload images.");
}

function disconnectGitHub(){
  sessionStorage.removeItem("gh_token");
  ghToken = "";
  githubConnected = false;

  document.getElementById("fileInput").disabled = true;
  document.getElementById("commitMessage").disabled = true;
  document.getElementById("uploadBtn").disabled = true;
  document.getElementById("connectBtn").disabled = false;
  document.getElementById("token").disabled = false;
  document.getElementById("username").disabled = false;
  document.getElementById("repo").disabled = false;
  document.getElementById("folder").disabled = false;

  setStatus("🔌 Disconnected. Enter token to reconnect.");
}

async function addImage(){
  if(!githubConnected){ setStatus("❌ Not connected", true); return; }

  const username = document.getElementById("username").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const folder = document.getElementById("folder").value.trim() || "images";
  const commitMessage = document.getElementById("commitMessage").value.trim() || "Add / update image";
  const fileInput = document.getElementById("fileInput");

  if(!fileInput.files.length){ setStatus("❌ Select a file first", true); return; }
  const file = fileInput.files[0];
  const path = `${folder}/${file.name}`;

  setStatus("⏳ Reading file...");
  const reader = new FileReader();
  reader.onload = async () => {
    const base64Content = reader.result.split(",")[1];
    const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
    let sha = null;

    try{
      const getRes = await fetch(apiUrl,{
        headers:{ Authorization:`token ${ghToken}`, Accept:"application/vnd.github+json" }
      });
      if(getRes.ok){ const data = await getRes.json(); sha = data.sha; }
      else if(getRes.status!==404){ setStatus(`❌ Error checking file: ${getRes.status}`, true); return; }
    }catch(err){ setStatus("❌ Network error checking file", true); return; }

    setStatus("⏳ Uploading image to GitHub...");
    const body = { message: commitMessage, content: base64Content };
    if(sha) body.sha = sha;

    try{
      const putRes = await fetch(apiUrl,{
        method:"PUT",
        headers:{ Authorization:`token ${ghToken}`, Accept:"application/vnd.github+json", "Content-Type":"application/json" },
        body: JSON.stringify(body)
      });
      if(!putRes.ok){
        const errData = await putRes.json();
        setStatus(`❌ Commit failed: ${errData.message||putRes.statusText}`, true);
        return;
      }
      setStatus("✅ Image committed successfully!");
      fileInput.value="";
      document.getElementById("commitMessage").value="";
    }catch(err){ setStatus("❌ Network error while committing", true); }
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
