<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cloud Image Notepad</title>

<style>
:root {
  --bg:#0b0b14;
  --panel:#141425;
  --accent:#ff4fa3;
  --muted:#9aa0b3;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top, #1a1a33, var(--bg));
  font-family:Inter, system-ui, sans-serif;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container {
  width:100%;
  max-width:1100px;
  background:rgba(20,20,37,.75);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

h2 {
  margin:0 0 16px;
  font-weight:600;
}

.inputs {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

input {
  background:#0f1020;
  border:1px solid #262650;
  color:white;
  padding:12px;
  border-radius:10px;
  outline:none;
}

input:focus {
  border-color:var(--accent);
}

.actions {
  display:flex;
  gap:12px;
  margin-top:14px;
}

button {
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(135deg, var(--accent), #ff7dc2);
  color:black;
}

button.secondary {
  background:#1e1e3a;
  color:white;
}

.status {
  font-size:14px;
  margin-top:10px;
  color:var(--muted);
}

.main {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  margin-top:24px;
}

.images {
  background:var(--panel);
  padding:14px;
  border-radius:16px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
  gap:12px;
  max-height:420px;
  overflow:auto;
}

.images img {
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.images img:hover {
  transform:scale(1.04);
  box-shadow:0 0 0 2px var(--accent);
}

.preview {
  background:var(--panel);
  padding:18px;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.preview img {
  width:100%;
  border-radius:14px;
  background:#000;
  object-fit:contain;
  max-height:320px;
}

.footer {
  text-align:center;
  font-size:13px;
  margin-top:18px;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="container">
  <h2>☁️ Cloud Image Notepad</h2>

  <div class="inputs">
    <input id="username" placeholder="GitHub Username">
    <input id="repo" placeholder="Repository Name">
    <input id="folder" value="images">
    <input id="token" placeholder="GitHub Token (repo access)">
  </div>

  <div class="actions">
    <button onclick="githubLogin()">Sign in with GitHub</button>
    <button class="secondary" onclick="connect()">Connect</button>
    <button class="secondary" onclick="refreshImages()">Refresh</button>
  </div>

  <div class="status" id="status"></div>

  <div class="main">
    <div class="images" id="imageList"></div>

    <div class="preview">
      <input type="file" id="fileInput">
      <button onclick="addImage()">Add / Overwrite Image</button>
      <img id="previewImage" alt="Preview">
    </div>
  </div>

  <div class="footer">
    GitHub-powered cloud image storage (frontend-only)
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
