<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloud Image Notepad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b14;
    --panel: rgba(20,20,37,0.85);
    --accent: #ff4fa3;
    --muted: #9aa0b3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(120deg, #1a1a33, #0b0b14);
  }

  .container {
    display: flex;
    flex-direction: row;
    width: 90%;
    max-width: 1200px;
    height: 80vh;
    background: var(--panel);
    border-radius: 20px;
    padding: 24px;
    gap: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  .sidebar, .main {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sidebar {
    width: 300px;
  }

  h2 {
    margin: 0;
    text-align: center;
    font-weight: 600;
    margin-bottom: 16px;
  }

  input, button {
    font-family: inherit;
  }

  input {
    background: #0f1020;
    border: 1px solid #262650;
    color: white;
    padding: 10px;
    border-radius: 10px;
    outline: none;
    width: 100%;
  }

  input:focus {
    border-color: var(--accent);
  }

  button {
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #ff7dc2);
    color: black;
    transition: 0.3s;
  }

  button:disabled {
    background: #444466;
    color: #aaaabb;
    cursor: not-allowed;
  }

  .images {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    overflow-y: auto;
    flex: 1;
    background: #141425;
    padding: 14px;
    border-radius: 16px;
  }

  .images img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }

  .images img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 0 2px var(--accent);
  }

  .preview {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #141425;
    padding: 14px;
    border-radius: 16px;
    width: 400px;
  }

  .preview img {
    width: 100%;
    max-height: 300px;
    border-radius: 12px;
    object-fit: contain;
    background: black;
  }

  .status {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
  }

</style>
</head>
<body>

<div class="container">
  <!-- Left panel: connection and images list -->
  <div class="sidebar">
    <h2>☁️ Cloud Notepad</h2>

    <label>GitHub Token (shown)</label>
    <input id="token" type="text" placeholder="GitHub Token (repo access)" autocomplete="off">

    <input id="username" placeholder="GitHub Username">
    <input id="repo" placeholder="Repository Name">
    <input id="folder" placeholder="Folder (default: images)" value="images">

    <button id="connectBtn" onclick="connectGitHub()">Connect to GitHub</button>
    <button onclick="refreshImages()" disabled id="refreshBtn">Refresh List</button>

    <div class="images" id="imageList"></div>
  </div>

  <!-- Right panel: preview and upload -->
  <div class="preview">
    <input type="file" id="fileInput" disabled>
    <input type="text" id="commitMessage" placeholder="Commit message" disabled>
    <button id="uploadBtn" onclick="addImage()" disabled>Add / Overwrite Image</button>
    <img id="previewImage" alt="Preview">
    <div class="status" id="status"></div>
  </div>
</div>

<script>
let githubConnected = false;
let ghToken = "";

function setStatus(msg, isError=false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.style.color = isError ? "#ff6666" : "#9aa0b3";
}

function connectGitHub() {
  const token = document.getElementById("token").value.trim();
  const username = document.getElementById("username").value.trim();
  const repo = document.getElementById("repo").value.trim();

  if (!token || !username || !repo) {
    setStatus("❌ Fill all fields!", true);
    return;
  }

  ghToken = token;
  githubConnected = true;

  document.getElementById("fileInput").disabled = false;
  document.getElementById("commitMessage").disabled = false;
  document.getElementById("uploadBtn").disabled = false;
  document.getElementById("refreshBtn").disabled = false;
  document.getElementById("connectBtn").disabled = true;
  document.getElementById("token").disabled = true;
  document.getElementById("username").disabled = true;
  document.getElementById("repo").disabled = true;
  document.getElementById("folder").disabled = true;

  setStatus("✅ Connected to GitHub. You can now upload and refresh images.");
  refreshImages();
}

async function refreshImages() {
  if (!githubConnected) return;
  const username = document.getElementById("username").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const folder = document.getElementById("folder").value.trim() || "images";

  setStatus("⏳ Loading images...");

  try {
    const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folder}`, {
      headers: { Authorization: `token ${ghToken}` }
    });

    if (!res.ok) {
      setStatus(`❌ Failed to load: ${res.status}`, true);
      return;
    }

    const files = await res.json();
    const listEl = document.getElementById("imageList");
    listEl.innerHTML = "";

    files.forEach(file => {
      if (file.type === "file" && /\.(png|jpg|jpeg|gif)$/i.test(file.name)) {
        const img = document.createElement("img");
        img.src = file.download_url;
        img.title = file.name;
        img.onclick = () => document.getElementById("previewImage").src = file.download_url;
        listEl.appendChild(img);
      }
    });

    setStatus(`✅ Loaded ${files.length} images.`);
  } catch (err) {
    setStatus("❌ Network error while loading images.", true);
  }
}

async function addImage() {
  if (!githubConnected) return;
  const fileInput = document.getElementById("fileInput");
  if (!fileInput.files.length) {
    setStatus("❌ Select an image first!", true);
    return;
  }

  const file = fileInput.files[0];
  const commitMessage = document.getElementById("commitMessage").value.trim() || "Add / update image";
  const username = document.getElementById("username").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const folder = document.getElementById("folder").value.trim() || "images";
  const path = `${folder}/${file.name}`;

  setStatus("⏳ Reading file...");

  const reader = new FileReader();
  reader.onload = async () => {
    const base64Content = reader.result.split(",")[1];
    const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

    // Check if file exists
    let sha = null;
    try {
      const getRes = await fetch(apiUrl, {
        headers: { Authorization: `token ${ghToken}` }
      });
      if (getRes.ok) {
        const data = await getRes.json();
        sha = data.sha;
      }
    } catch (err) {
      setStatus("❌ Network error checking file.", true);
      return;
    }

    // Upload / update
    try {
      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: { 
          Authorization: `token ${ghToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: commitMessage, content: base64Content, ...(sha ? {sha} : {}) })
      });

      if (!putRes.ok) {
        const errData = await putRes.json();
        setStatus(`❌ Commit failed: ${errData.message || putRes.statusText}`, true);
        return;
      }

      setStatus("✅ Image committed successfully!");
      fileInput.value = "";
      document.getElementById("commitMessage").value = "";
      refreshImages();
    } catch (err) {
      setStatus("❌ Network error while committing.", true);
    }
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
