<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Image Notepad - Token Visible</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

:root {
  --bg-dark: #0a0a1f;
  --bg-gradient-start: #1b1b38;
  --bg-gradient-end: #0a0a1f;
  --panel-bg: rgba(26, 26, 51, 0.9);
  --accent: #ff4fa3;
  --accent-light: #ff7dc2;
  --text-light: #e0e0f0;
  --text-muted: #9aa0b3;
  --error-color: #ff6b6b;
  --success-color: #32d48a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
  font-family: 'Inter', sans-serif;
  color: var(--text-light);
  display: flex; justify-content: center; align-items: center;
}

.container {
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  border-radius: 20px;
  padding: 28px 32px;
  width: 95%;
  max-width: 1200px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3), 0 0 60px var(--accent-light);
}

h2 {
  text-align: center;
  color: var(--accent-light);
  margin-bottom: 16px;
  font-weight: 600;
}

.inputs {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.inputs input {
  flex: 1 1 200px;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1.5px solid #262650;
  background: #1f1f3a;
  color: var(--text-light);
  outline: none;
}

.inputs input:focus { border-color: var(--accent); }

.buttons {
  display: flex;
  gap: 12px;
  margin: 16px 0;
  flex-wrap: wrap;
  justify-content: center;
}

.buttons button {
  padding: 12px 24px;
  font-weight: 600;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: black;
  transition: 0.3s;
}

.buttons button.secondary {
  background: #262650;
  color: var(--text-light);
}

.buttons button:disabled { background: #444466; cursor: not-allowed; }

.main {
  display: flex;
  gap: 24px;
  margin-top: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

.image-list-panel, .preview-panel {
  background: var(--panel-bg);
  padding: 16px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 280px;
  max-height: 600px;
  overflow-y: auto;
}

.image-list {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.image-list img {
  max-width: 90px; max-height: 90px;
  object-fit: cover;
  border-radius: 12px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.image-list img:hover, .image-list img.selected {
  transform: scale(1.05);
  border-color: var(--accent);
}

.preview-panel img {
  max-width: 100%;
  max-height: 500px;
  border-radius: 16px;
  margin-top: 12px;
}

.status {
  text-align: center;
  margin-top: 12px;
  min-height: 24px;
  font-weight: 600;
}

.status.error { color: var(--error-color); }
.status.success { color: var(--success-color); }

.token-hint {
  font-size: 0.85rem;
  background: #fff7cc;
  color: #5a4b00;
  padding: 8px 12px;
  border-radius: 10px;
  margin-bottom: 6px;
  user-select: none;
}

.token-hint code {
  background: rgba(0,0,0,0.12);
  padding: 2px 6px;
  border-radius: 6px;
  font-family: monospace;
}

@media(max-width: 900px) {
  .main { flex-direction: column; align-items: center; }
  .image-list-panel, .preview-panel { max-height: 400px; width: 90%; }
}
</style>
</head>
<body>
<div class="container">
  <h2>☁️ Cloud Image Notepad</h2>

  <div class="inputs">
    <!-- Token is now visible -->
    <input id="token" type="text" placeholder="GitHub Personal Access Token (Visible)" />
    <input id="username" type="text" placeholder="GitHub Username" />
    <input id="repo" type="text" placeholder="Repository Name" />
    <input id="folder" type="text" placeholder="Folder (default: images)" value="images" />
  </div>

  <div class="buttons">
    <button id="connectBtn">Connect to GitHub</button>
    <button id="uploadBtn" disabled>Add / Overwrite Image</button>
    <button class="secondary" id="refreshBtn">Refresh List</button>
  </div>

  <div class="main">
    <div class="image-list-panel">
      <input id="fileInput" type="file" accept="image/*" disabled />
      <input id="commitMessage" type="text" placeholder="Commit message" disabled />
      <div class="image-list" id="imageList"></div>
    </div>

    <div class="preview-panel">
      <img id="previewImage" alt="Preview" />
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
let githubConnected = false;
let ghToken = "";
let selectedImageName = "";

function setStatus(msg, isError = false) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status";
  if(isError) s.classList.add("error");
  else if(msg.includes("success")||msg.includes("Connected")) s.classList.add("success");
}

function toggleInputs(state) {
  githubConnected = state;
  document.getElementById("fileInput").disabled = !state;
  document.getElementById("commitMessage").disabled = !state;
  document.getElementById("uploadBtn").disabled = !state;
  document.getElementById("connectBtn").disabled = state;
  document.getElementById("username").disabled = state;
  document.getElementById("repo").disabled = state;
  document.getElementById("folder").disabled = state;
  document.getElementById("token").disabled = false; // keep token editable & visible
}

async function testConnection(token, username, repo) {
  try {
    const res = await fetch(`https://api.github.com/repos/${username}/${repo}`, {
      headers: { Authorization: `token ${token}`, Accept:"application/vnd.github+json" }
    });
    if(!res.ok) return {success:false, message:(await res.json()).message};
    return {success:true};
  } catch { return {success:false,message:"Network error"}; }
}

async function connectGitHub() {
  const token = document.getElementById("token").value.trim();
  const username = document.getElementById("username").value.trim();
  const repo = document.getElementById("repo").value.trim();
  if(!token || !username || !repo) { setStatus("❌ Please fill all fields", true); return; }
  setStatus("⏳ Connecting...");
  const result = await testConnection(token, username, repo);
  if(!result.success) { setStatus("❌ "+result.message,true); return; }
  ghToken = token;
  toggleInputs(true);
  setStatus("✅ Connected! Ready to upload and refresh images.");
  loadImages();
}

async function loadImages() {
  if(!githubConnected){ setStatus("❌ Not connected",true); return; }
  const username = document.getElementById("username").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const folder = document.getElementById("folder").value.trim()||"images";
  setStatus("⏳ Loading images...");
  try {
    const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folder}`, {
      headers:{Authorization:`token ${ghToken}`,Accept:"application/vnd.github+json"}
    });
    if(!res.ok) { setStatus("❌ Failed to load images",true); return; }
    const files = await res.json();
    const images = files.filter(f=>/\.(png|jpe?g|gif|bmp|webp|svg)$/i.test(f.name));
    const list = document.getElementById("imageList");
    list.innerHTML="";
    images.forEach(img=>{
      const el=document.createElement("img");
      el.src=img.download_url; el.alt=img.name;
      el.addEventListener("click",()=>{document.getElementById("previewImage").src=img.download_url;selectedImageName=img.name;});
      list.appendChild(el);
    });
    if(images.length>0){ document.getElementById("previewImage").src=images[0].download_url; selectedImageName=images[0].name; }
    setStatus(`✅ Loaded ${images.length} images`);
  } catch { setStatus("❌ Network error",true); }
}

async function addImage() {
  if(!githubConnected){ setStatus("❌ Not connected",true); return; }
  const fileInput=document.getElementById("fileInput");
  if(!fileInput.files.length){ setStatus("❌ Select a file first",true); return; }
  const file=fileInput.files[0];
  const path=(document.getElementById("folder").value||"images")+"/"+file.name;
  const commitMessage=document.getElementById("commitMessage").value||"Add / update image";
  setStatus("⏳ Uploading...");
  const reader=new FileReader();
  reader.onload=async ()=>{
    const content=reader.result.split(",")[1];
    const apiUrl=`https://api.github.com/repos/${document.getElementById("username").value}/${document.getElementById("repo").value}/contents/${path}`;
    let sha=null;
    try{
      const getRes=await fetch(apiUrl,{headers:{Authorization:`token ${ghToken}`,Accept:"application/vnd.github+json"}});
      if(getRes.ok){ sha=(await getRes.json()).sha; }
    }catch{}
    const body={message:commitMessage,content};
    if(sha) body.sha=sha;
    try{
      const putRes=await fetch(apiUrl,{method:"PUT",headers:{Authorization:`token ${ghToken}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!putRes.ok){ setStatus("❌ Commit failed",true); return; }
      setStatus("✅ Image committed successfully!");
      fileInput.value=""; document.getElementById("commitMessage").value="";
      loadImages();
    }catch{ setStatus("❌ Network error",true); }
  };
  reader.readAsDataURL(file);
}

document.getElementById("connectBtn").addEventListener("click",connectGitHub);
document.getElementById("refreshBtn").addEventListener("click",loadImages);
document.getElementById("uploadBtn").addEventListener("click",addImage);
</script>
</body>
</html>
